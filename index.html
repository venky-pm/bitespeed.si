<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Domain For Sale | bitespeed.si</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #f4f7fb; /* Soft off-white to make the glass pop */
            color: #1e293b;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated Background Elements */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4; /* Slightly more transparent for light theme */
            animation: float 15s infinite ease-in-out alternate;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: #3b82f6; /* Blue */
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: #8b5cf6; /* Purple */
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: #0ea5e9; /* Light Blue */
            top: 40%;
            left: 60%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Glassmorphism Container (Light Theme) */
        .glass-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 540px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), 
                        inset 0 1px 0 rgba(255, 255, 255, 1);
            text-align: center;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .tagline {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
            margin-bottom: 24px;
            font-weight: 600;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            margin: 0 0 20px 0;
            letter-spacing: -1.5px;
            color: #0f172a;
        }

        h1 span {
            font-weight: 700;
            background: linear-gradient(to right, #0f172a, #4338ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 40px;
        }

        /* Inner Contact Box (Light Glass) */
        .contact-box {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            padding: 25px;
            text-align: left;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .contact-box h2 {
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding-bottom: 10px;
        }

        .contact-details {
            font-size: 0.95rem;
            color: #334155;
            line-height: 1.8;
        }
        
        .contact-details strong {
            color: #0f172a;
            font-weight: 600;
        }

        .contact-details a {
            color: #4338ca;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .contact-details a:hover {
            color: #312e81;
        }

        /* Hover-animated Button (Dark on Light) */
        .btn {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            text-decoration: none;
            padding: 18px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid #0f172a;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000000;
            z-index: -1;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
        }

        .btn:hover::before {
            transform: scaleX(1);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .glass-container { padding: 40px 25px; }
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="glass-container">
        <div class="tagline">Premium Digital Asset</div>
        
        <h1><span>bitespeed</span>.si</h1>
        
        <p class="description">This domain name is independently owned and currently available for strategic acquisition.</p>
        
        <div class="contact-box">
            <h2>Direct Inquiry</h2>
            <div class="contact-details">
                Managed by: <strong>Venkatesh Murthy (Product Manager) </strong><br>
                Location: <strong>Bengaluru, Karnataka, India</strong><br>
                Email: <strong><a href="mailto:venktastic@gmail.com?subject=Acquisition Inquiry: bitespeed.si">venktastic@gmail.com</a></strong>
            </div>
        </div>
        
        <a href="mailto:venktastic@gmail.com?subject=Acquisition Inquiry: bitespeed.si" class="btn">Submit an Offer</a>
    </div>
</body>
</html>
